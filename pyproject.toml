[project]
name = "beqcatalogue"
version = "0.0.1"
description = "A website for browsing the beqcatalogue"
authors = [
    { name = "3ll3d00d", email = "mattkhan+beqc@gmail.com" }
]
license = "MIT"
readme = "README.md"
homepage = "https://beqcatalogue.readthedocs.io/"
repository = "https://github.com/3ll3d00d/beqcatalogue"
requires-python = ">=3.13, <3.14"
dependencies = [
    "jinja2 >= 2.11.3",
    "githubkit",
    "mkdocs-materialx[imaging] >= 10.1.0"
]

[tool.poetry.group.dev.dependencies]
mkdocs = "*"
mkdocs-materialx = "*"
pymdown-extensions = ">=10.0"
requests = ">=2.31.0"
pytest = ">=8.0"

# Device-specific catalogue optimisation (beqcatalogue/devices.py); not needed by the main build.
# numpy/scipy are pinned to the identity of beqforge's bundled optimiser result seed.
[tool.poetry.group.optimiser]
optional = true

[tool.poetry.group.optimiser.dependencies]
beqforge = { version = "==0.2.0", extras = ["optimiser"] }
numpy = "==2.4.2"
scipy = "==1.18.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# the build scripts import siblings directly (e.g. `from iir import ...`)
pythonpath = ["beqcatalogue", "."]
testpaths = ["tests"]
